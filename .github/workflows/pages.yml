# GitHub Pages deployment — MANUAL FALLBACK ONLY.
# The site builds via the legacy push-triggered path (.nojekyll, no Jekyll).
# On 2026-08-06 the legacy builder wedged for hours and this Actions path
# carried the deploys; keep it dispatch-only so the two paths never race.
name: Deploy Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Milliseconds, not minutes — GitHub's Pages backend has been slow
          # to reach a terminal state today (default 10 min timed out twice).
          timeout: 1800000
